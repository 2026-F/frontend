name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설치 (npm 캐시 사용)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치 (package-lock.json 기준으로 정확히 설치)
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 빌드 (타입 체크 포함)
        run: npm run build